name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The native build needs this exact NDK and CMake; install them up front instead of relying on auto-download.
      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0"

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.2-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SOSDUO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: release APK will be signed with the debug key."
          fi

      - name: Build
        env:
          SOSDUO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SOSDUO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SOSDUO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" \
            -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="${{ steps.ver.outputs.name }}" \
            assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "SeaOfStarsDuo-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SeaOfStarsDuo-${{ steps.ver.outputs.name }}
          path: SeaOfStarsDuo-*.apk

      - name: Rolling "Latest build" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: "Automatic build of `main` at ${{ github.sha }} (versionCode ${{ github.run_number }})."
          files: SeaOfStarsDuo-*.apk

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          f="docs/releases/v${{ steps.ver.outputs.name }}.md"
          if [ -f "$f" ]; then cp "$f" release-notes.md; else : > release-notes.md; fi

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sea of Stars Duo ${{ steps.ver.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: SeaOfStarsDuo-*.apk
